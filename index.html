<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2ecff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jumble Dreams">
<link rel="manifest" href="./manifest.webmanifest"><title>Jumble Dreams</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;
  font-family:'Quicksand',-apple-system,BlinkMacSystemFont,sans-serif;background:#f2ecff;color:#5a4a8f}
#app{
  height:100dvh;width:100%;max-width:430px;margin:auto;position:relative;overflow:hidden;
  padding:max(8px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));
  display:grid;grid-template-rows:clamp(108px,14.5dvh,132px) minmax(0,1fr) clamp(160px,19dvh,190px);
  background:
    radial-gradient(circle at 16% 8%,rgba(255,158,235,.35),transparent 40%),
    radial-gradient(circle at 88% 14%,rgba(120,224,255,.32),transparent 42%),
    radial-gradient(circle at 30% 96%,rgba(159,255,212,.30),transparent 45%),
    linear-gradient(165deg,#eef0ff 0%,#f3e8ff 45%,#ffe9f6 100%);
  isolation:isolate;
}
.bg{position:absolute;inset:0;z-index:-6;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(rgba(167,139,250,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(167,139,250,.14) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 25%,#000 35%,transparent 100%);
}
.orb{position:absolute;border-radius:50%;filter:blur(26px);pointer-events:none;z-index:-5}
.orb.o1{width:170px;height:170px;left:-50px;top:5%;background:rgba(255,158,235,.55);animation:drift 9s ease-in-out infinite alternate}
.orb.o2{width:190px;height:190px;right:-60px;top:46%;background:rgba(120,224,255,.50);animation:drift 11s ease-in-out infinite alternate-reverse}
.orb.o3{width:150px;height:150px;left:18%;bottom:-40px;background:rgba(159,255,212,.5);animation:drift 13s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(14px,-10px) scale(1.08)}}
.scan{position:absolute;left:0;right:0;height:110px;z-index:-4;pointer-events:none;opacity:.28;
  background:linear-gradient(180deg,transparent,rgba(167,139,250,.6),transparent);
  animation:scanmove 7s linear infinite}
@keyframes scanmove{0%{top:-110px}100%{top:100%}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb3ec;box-shadow:0 0 8px #ffb3ec;z-index:-3;pointer-events:none;animation:twinkle 2.6s ease-in-out infinite alternate}
.spark:nth-child(1){left:9%;top:20%}.spark:nth-child(2){left:82%;top:15%;animation-delay:.5s;background:#7fe0ff;box-shadow:0 0 8px #7fe0ff}
.spark:nth-child(3){left:14%;top:66%;animation-delay:1s;background:#8dffce;box-shadow:0 0 8px #8dffce}.spark:nth-child(4){left:70%;top:58%;animation-delay:1.5s;background:#ffb3ec;box-shadow:0 0 8px #ffb3ec}
.spark:nth-child(5){left:45%;top:10%;animation-delay:.8s;background:#c9a9ff;box-shadow:0 0 8px #c9a9ff}
@keyframes twinkle{0%{opacity:.2;transform:scale(.6)}100%{opacity:1;transform:scale(1.4)}}

header{z-index:3;display:grid;grid-template-columns:minmax(82px,1fr) minmax(132px,1.25fr) minmax(82px,1fr);align-items:start;gap:5px;width:100%;overflow:visible}
.hud{display:flex;gap:6px;min-width:0}.hud.r{justify-content:flex-end}
.pill,.round{
  border:1.5px solid rgba(255,255,255,.9);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(238,228,255,.8));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 10px rgba(150,120,220,.22);
  color:#7a5bd6;font-weight:700;font-family:'Quicksand',sans-serif;backdrop-filter:blur(6px)
}
.round{width:42px;height:42px;flex:0 0 40px;border-radius:14px;font-size:17px;display:flex;align-items:center;justify-content:center}
.pill{height:42px;border-radius:14px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-size:13px}
.starIcon{color:#ff8fdc;font-size:15px;text-shadow:0 0 6px rgba(255,143,220,.6)}.clockIcon{font-size:14px;color:#7fd0ff}.musicIcon{font-size:18px}
.pauseIcon{display:inline-block;width:12px;height:16px;border-left:4px solid #7a5bd6;border-right:4px solid #7a5bd6;border-radius:2px}
.brand{text-align:center;min-width:0}
.brand b{display:block;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(23px,7vw,29px);line-height:1;letter-spacing:.5px;
  background:linear-gradient(120deg,#ff8fdc,#a78bfa 55%,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(167,139,250,.35))}
.brand small{display:block;font-size:9px;letter-spacing:5px;font-weight:700;color:#9d7fe8;margin-top:1px}
.level{margin-top:6px;border:1.5px solid rgba(255,255,255,.9);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,236,250,.8));
  border-radius:12px;padding:4px 12px;font-size:11px;letter-spacing:.5px;color:#a1509e;font-weight:700;box-shadow:0 3px 8px rgba(214,140,220,.22)}

main{z-index:2;min-height:0;height:100%;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) clamp(112px,30vw,132px);gap:7px;align-items:stretch;padding:2px 0 0}
.board{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:flex-start;gap:3px;padding:4px 0 4px 2px;overflow:hidden}
.wordRow{display:flex;gap:3px;margin-left:min(var(--indent),16px)!important;height:clamp(25px,3.6dvh,36px);flex:none}
.wordRow .cell{
  width:clamp(25px,7.6vw,35px);height:100%;flex:none;border-radius:9px;display:grid;place-items:center;
  color:#5a4a8f;font-family:'Quicksand',sans-serif;font-size:clamp(14px,4.4vw,19px);font-weight:700;
  background:linear-gradient(160deg,#ffffff,#f3edff);
  border:1.5px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(150,120,220,.18);
}
.wordRow.blue .cell{background:linear-gradient(160deg,#e3f7ff,#c3ecff);border-color:#9fdcff}
.wordRow.purple .cell{background:linear-gradient(160deg,#f2e8ff,#e0cdff);border-color:#c6a5ff}
.wordRow.green .cell{background:linear-gradient(160deg,#e4fff2,#c3fbdf);border-color:#96f0c4}
.wordRow.pink .cell{background:linear-gradient(160deg,#ffe8f6,#ffcdec);border-color:#ffa5dc}
.wordRow.goldrow .cell{background:linear-gradient(160deg,#fff7dc,#ffe9a8);border-color:#ffd257}
.wordRow .cell.gold{background:linear-gradient(160deg,#fff2b8,#ffd257);color:#8a5a00;border-color:#ffbf3d;
  box-shadow:0 0 10px rgba(255,196,0,.45);animation:wordPop .4s cubic-bezier(.2,1.4,.3,1)}
.wordRow .cell.hintedCell{color:#fff;background:linear-gradient(160deg,#ff9fe5,#c98bff);border-color:#ff9fe5;
  font-weight:800;animation:hintGlow 1.2s ease-in-out infinite alternate}
@keyframes wordPop{0%{transform:scale(.7) rotate(-2deg)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes hintGlow{to{box-shadow:0 0 14px rgba(201,139,255,.75)}}

.side{min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.card{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(245,236,255,.88));
  border:1.5px solid rgba(255,255,255,.9);border-radius:18px;padding:8px 7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px rgba(150,120,220,.20);backdrop-filter:blur(6px)}
.card h3{font-size:10px;text-align:center;margin:0 0 5px;letter-spacing:1.5px;font-weight:700;color:#8a6fd6;text-transform:uppercase}
.card h3 span{color:#ff8fdc}
.found{font-size:9px;font-weight:700;height:clamp(160px,24dvh,225px);overflow:hidden}
.answerRow{display:flex;justify-content:center;gap:2px;padding:1px 0;min-height:16px}
.answerBox{width:12px;height:14px;border-radius:4px;background:rgba(167,139,250,.08);border:1.5px solid rgba(167,139,250,.3);
  display:flex;align-items:center;justify-content:center;font-size:8px;color:#8a6fd6}
.answerRow.done .answerBox{background:linear-gradient(160deg,#fff2b8,#ffd257);border-color:#ffbf3d;color:#8a5a00;font-weight:800;box-shadow:0 0 4px rgba(255,196,0,.3)}
.answerRow.dream .answerBox{border-color:#ff9fe5;box-shadow:0 0 4px rgba(255,159,229,.4)}
.found i{font-style:normal;color:#ff8fdc}
.goal{text-align:center;font-size:9px;font-weight:600;padding:7px 5px;color:#7a5bd6}
.goal b{font-weight:800;color:#5a4a8f}
.bar{height:7px;background:rgba(167,139,250,.12);border:1.5px solid rgba(167,139,250,.28);border-radius:8px;margin:6px 2px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ff9fe5,#a78bfa,#7fd8ff);width:0;box-shadow:0 0 8px rgba(167,139,250,.5)}
.count{font-size:9px;font-weight:700;color:#8a6fd6;letter-spacing:.5px}

.controls{z-index:3;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:max(4px,env(safe-area-inset-bottom))}
.msg{height:16px;color:#8a6fd6;font-size:11px;font-weight:600;letter-spacing:.2px}
.spellWord{height:17px;text-align:center;color:#c9982e;font-size:14px;font-weight:800;letter-spacing:5px;margin-top:-1px}
.tiles{height:60px;width:100%;display:flex;justify-content:center;gap:4px;touch-action:none;align-items:start}
.tile{width:clamp(38px,11.5vw,47px);height:54px;flex:0 0 clamp(38px,11.5vw,47px);border-radius:14px;
  border:1.5px solid rgba(255,255,255,.95);
  background:linear-gradient(160deg,#ffffff,#f2ecff);
  box-shadow:0 3px 0 #d7c6ff,0 6px 14px rgba(150,120,220,.28),inset 0 1px 0 rgba(255,255,255,.9);
  color:#6a53c4;font-family:'Quicksand',sans-serif;font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;position:relative}
.tile.sel{background:linear-gradient(160deg,#ffe4f7,#ffc9ee);border-color:#ff9fe5;
  box-shadow:0 3px 0 #e089c9,0 0 14px rgba(255,159,229,.7),inset 0 1px 0 rgba(255,255,255,.9);
  color:#c1348f;transform:translateY(-3px)}
.tile.drag{position:fixed;z-index:50;pointer-events:none;transform:rotate(-5deg) scale(1.06)}
.ph{width:clamp(38px,11.5vw,47px);height:54px;flex:0 0 clamp(38px,11.5vw,47px)}
.track{width:72%;height:24px;position:relative;touch-action:none}
.rail{position:absolute;top:5px;left:0;right:0;height:14px;border-radius:10px;background:rgba(167,139,250,.14);border:1.5px solid rgba(167,139,250,.3);box-shadow:inset 0 2px 5px rgba(150,120,220,.2)}
.glow{position:absolute;top:3px;height:18px;border-radius:10px;background:linear-gradient(90deg,rgba(255,159,229,.55),rgba(167,139,250,.55));box-shadow:0 0 12px rgba(200,150,255,.5);display:none}
.actions{position:absolute;bottom:max(28px,calc(env(safe-area-inset-bottom) + 22px));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:20}
.action{pointer-events:auto;width:46px;height:46px;border-radius:14px;border:1.5px solid rgba(255,255,255,.95);
  background:linear-gradient(160deg,#ffffff,#f2ecff);color:#8a6fd6;font-weight:700;box-shadow:0 3px 0 #d7c6ff,0 5px 10px rgba(150,120,220,.22)}
.action b{display:block;font-size:15px;line-height:14px}.action span{font-size:7px;letter-spacing:.5px}
.tagline{position:absolute;bottom:max(2px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  color:#a89bd6;font-size:8px;font-weight:600;letter-spacing:3px;z-index:8}
.tagline span{color:#ff8fdc}

.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(200,180,240,.4);backdrop-filter:blur(10px);align-items:center;justify-content:center}
.overlay.show{display:flex}
.win{background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(245,236,255,.97));border:1.5px solid rgba(255,255,255,.95);
  border-radius:22px;padding:24px;text-align:center;width:82%;color:#5a4a8f;box-shadow:0 0 40px rgba(167,139,250,.25),0 20px 50px rgba(150,120,220,.3)}
.win h2{font-family:'Baloo 2',sans-serif;font-size:17px;letter-spacing:.3px;
  background:linear-gradient(120deg,#ff8fdc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.win button{border:1.5px solid rgba(255,255,255,.7);border-radius:14px;background:linear-gradient(135deg,#ff9fe5,#a78bfa);
  color:#fff;padding:11px 20px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 12px rgba(167,139,250,.35)}
.pausepanel,.levelpanel{max-height:78%;overflow:hidden}.menuBtns{display:grid;gap:9px}.menuBtns button{width:100%}
.levelpanel{width:90%;padding:18px}.tiny{font-size:11px;margin-top:-5px;color:#a89bd6}
.levelgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:390px;overflow:auto;padding:4px;margin:8px 0 14px}
.levelgrid button{padding:0;width:100%;height:50px;border-radius:14px;background:rgba(167,139,250,.08);
  border:1.5px solid rgba(167,139,250,.25);color:#8a6fd6;font-size:11px;line-height:13px;font-weight:700}
.levelgrid button .stars{display:block;font-size:9px;color:#ffbf3d;letter-spacing:-1px}
.levelgrid button.done{background:linear-gradient(160deg,#fff2b8,#ffe9a8);border-color:#ffbf3d;color:#8a5a00}
.levelgrid button.current{outline:2px solid #ff9fe5;outline-offset:1px}
.levelgrid button:disabled{opacity:.35}
.skipBtn{background:linear-gradient(135deg,#a78bfa,#ff9fe5)!important;color:#fff!important;border:1.5px solid rgba(255,255,255,.7)!important}

@media(max-width:390px){
  #app{padding-left:8px;padding-right:8px;grid-template-rows:104px minmax(0,1fr) 168px}
  main{grid-template-columns:minmax(0,1fr) 106px;gap:5px}
  .brand b{font-size:22px}.round{width:38px;height:38px;flex-basis:38px}.pill{padding:0 7px;font-size:11px}
  .wordRow .cell{width:clamp(23px,6.8vw,29px)}
  .tile,.ph{width:41px;flex-basis:41px;height:50px}
}
@media(max-height:760px){
  #app{grid-template-rows:100px minmax(0,1fr) 150px}
  .found{height:150px}.wordRow{height:24px}.tiles{height:52px}.tile,.ph{height:48px}
}
</style></head><body><div id="app"><div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="scan" aria-hidden="true"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><header><div class="hud"><button class="round iconBtn" id="pause" aria-label="Pause"><span class="pauseIcon"></span></button><div class="pill"><span class="starIcon">★</span><span id="score">0</span></div></div><div class="brand"><b>Jumble</b><small>DREAMS</small><button class="level" id="levelPicker" aria-label="Choose an unlocked level">LEVEL <span id="level">1</span> ▾</button></div><div class="hud r"><button class="round iconBtn" id="sound" aria-label="Toggle sound"><span class="musicIcon">♫</span></button><div class="pill"><span class="clockIcon">◷</span><span id="time">0:00</span></div></div></header>
<main><div class="board" id="board"></div><div class="side"><div class="card"><h3><span>◈</span> WORDS FOUND <span>◈</span></h3><div class="found" id="found"></div></div><div class="card goal"><b>Find the longest word<br>to complete the level!</b>
<div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count">0/0</div></div>
<button class="hintBtn" id="hint" aria-label="Use a hint"><span class="bulb">✦</span> Hint <span id="hintCount">(3)</span></button></div></main>

</section></div>

<div class="overlay" id="pauseOverlay"><div class="win pausepanel">
  <div style="font-size:26px;color:#a78bfa;text-shadow:0 0 10px rgba(167,139,250,.4)">⏸</div><h2>PAUSED</h2>
  <div class="menuBtns">
    <button id="resume">Resume</button>
    <button id="restart">Restart Level</button>
    <button id="levelsBtn">Levels</button><button id="skipBtn" class="skipBtn">Skip Level →</button>
    <button id="menuSound">Sound: On</button>
  </div>
</div></div>
<div class="overlay" id="levelsOverlay"><div class="win levelpanel">
  <h2>LEVELS</h2><p class="tiny">Replay any level you've unlocked.</p>
  <div class="levelgrid" id="levelgrid"></div>
  <button id="closeLevels">Back</button>
</div></div>
<div class="overlay" id="overlay"><div class="win"><div style="font-size:28px;color:#ff9fe5;text-shadow:0 0 10px rgba(255,159,229,.5)">✦</div><h2>LEVEL COMPLETE</h2><p id="wintext"></p><button id="next">Next Level →</button></div></div>

function mix(s){let a=[...s];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  levelStates[li]={order:[...order],found:[...found],bonus:[...bonus],elapsed:elapsed+(paused?0:Date.now()-runStart)};
  localStorage.setItem(stateKey(),JSON.stringify({li,order,found,bonus,score,unlocked,completed,stars,elapsed:elapsed+(paused?0:Date.now()-runStart),soundOn,levelStates,hints,hinted}))

function load(){try{let d=JSON.parse(localStorage.getItem(stateKey())||"null");if(!d)return false;li=Math.max(0,Math.min(levels.length-1,d.li||0));score=d.score||0;unlocked=Math.max(1,Math.min(levels.length,d.unlocked||1));completed=Array.isArray(d.completed)?d.completed:[];stars=d.stars||{};levelStates=d.levelStates||{};hints=Number.isFinite(d.hints)?d.hints:3;hinted=d.hinted||{};unlocked=levels.length;found=(d.found||[]).filter(w=>cur().words.includes(w));bonus=(d.bonus||[]).filter(w=>DICT.has(w)&&canMake(w,cur().letters));order=(d.order&&d.order.length===cur().letters.length)?d.order:mix(cur().letters);elapsed=d.elapsed||0;soundOn=d.soundOn!==false;runStart=Date.now();return true}catch(e){return false}}
function unlockAudio(){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
["touchstart","pointerdown","click"].forEach(ev=>document.addEventListener(ev,()=>{unlockAudio();setTimeout(startMusic,80)},{passive:true}));

let musicOn=true,musicTimer=null,musicStep=0;
// High-tech soundtrack: a driving square-wave arpeggio over a pulsing sub-bass, synthwave-style.
const arpNotes=[220.00,261.63,329.63,392.00,440.00,392.00,329.63,261.63,220.00,164.81,196.00,246.94,293.66,246.94,196.00,164.81];
const bassNotes=[55.00,55.00,61.74,49.00];
function startMusic(){
 if(!soundOn||!musicOn||paused)return;
 unlockAudio();
 if(!audioCtx||musicTimer)return;
 const step=()=>{
   if(!soundOn||!musicOn||paused){stopMusic();return}
   const i=musicStep%arpNotes.length;
   tone(arpNotes[i],.16,"square",.022);
   if(i%4===0)tone(bassNotes[(musicStep>>2)%bassNotes.length],.34,"sawtooth",.05);
   if(i%8===6)tone(arpNotes[i]*2,.08,"square",.010);
   musicStep++;
 };
 step();musicTimer=setInterval(step,145);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

function tone(freq,dur,type="sine",vol=.16,delay=0){if(!soundOn)return;unlockAudio();try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(k){if(k==="tap"){tone(784,.07,"sine",.07);tone(1175,.10,"sine",.035,.035)};if(k==="drag")tone(350,.09,"triangle",.05);if(k==="bad"){tone(190,.13,"triangle",.05);tone(150,.16,"triangle",.04,.08)}if(k==="shuffle"){tone(440,.09,"sine",.05);tone(610,.1,"sine",.05,.07);tone(820,.13,"sine",.05,.14)}if(k==="word"){tone(523,.13,"sine",.09);tone(659,.16,"sine",.075,.06);tone(988,.22,"sine",.06,.12);tone(1319,.34,"sine",.04,.20)}if(k==="level"){
 [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.24,i%2?"triangle":"sine",.095,i*.065));
 [1047,1319,1568,2093].forEach((f,i)=>tone(f,.5,"sine",.075,.42+i*.07));
 tone(262,.65,"triangle",.045,.40);
}}

function layout(){
 const words=cur().words.slice().sort((a,b)=>b.length-a.length).slice(0,10);
 const h=hinted[li]||{};
 const colours=["blue","purple","green","pink","blue","purple","green","pink","goldrow","blue"];
 $("board").innerHTML=words.map((w,k)=>{
   const reveals=Array.isArray(h[w])?h[w]:(Number.isInteger(h[w])?[h[w]]:[]);
   const done=found.includes(w);
   const cells=[...w].map((ch,j)=>`<span class="cell ${done?"gold":""} ${reveals.includes(j)&&!done?"hintedCell":""}">${done||reveals.includes(j)?ch:""}</span>`).join("");
   return `<div class="wordRow ${colours[k%colours.length]} ${done?"wordDone":""}" style="--indent:${[0,28,8,46,0,35,7,48,22,40][k]}px">${cells}</div>`
 }).join("")
}
function render(){
 $("score").textContent=score;$("level").textContent=(li+1)+" / 100";$("hintCount").textContent="("+hints+")";
 let rows=cur().words.map(w=>{let done=found.includes(w),dream=w===cur().letters;return `<div class="answerRow ${done?"done":""} ${dream?"dream":""}">${[...w].map(ch=>`<span class="answerBox">${done?ch:""}</span>`).join("")}</div>`}).join("");

}

function paint(x){let c=centers(),i=nearest(x);if(a<0)a=i;b=i;let lo=Math.min(a,b),hi=Math.max(a,b),r=track.getBoundingClientRect();glow.style.display="block";glow.style.left=(c[lo]-r.left-20)+"px";glow.style.width=(c[hi]-c[lo]+40)+"px";[...tiles.children].forEach((t,j)=>t.classList.toggle("sel",j>=lo&&j<=hi))}
function clear(){a=b=-1;selectedIdx=[];glow.style.display="none";[...tiles.children].forEach(t=>t.classList.remove("sel"))}
function message(x){$("msg").textContent=x;clearTimeout(message.t);message.t=setTimeout(()=>$("msg").textContent="",1550)}

function useHint(){
 if(paused)return;
 if(hints<=0){message("No hints left");sfx("bad");return}
 const candidates=cur().words.filter(w=>!found.includes(w));
 if(!candidates.length){message("All puzzle words found!");return}
 hinted[li]=hinted[li]||{};
 let w=candidates.sort((a,b)=>{
   const ar=(hinted[li][a]||[]).length, br=(hinted[li][b]||[]).length;
   return (b.length-br)-(a.length-ar)
 })[0];
 let revealed=hinted[li][w];
 if(!Array.isArray(revealed)) revealed=Number.isInteger(revealed)?[revealed]:[];
 let choices=[...w].map((_,i)=>i).filter(i=>!revealed.includes(i));
 if(!choices.length){message("That word is fully hinted ✦");return}
 let pos=choices[Math.floor(Math.random()*choices.length)];
 revealed.push(pos);hinted[li][w]=revealed;
 hints--;sfx("word");message("Dream dust revealed a letter ✦");
 render();save()
}

function submit(){let lo,hi;if(selectedIdx.length){lo=Math.min(...selectedIdx);hi=Math.max(...selectedIdx)}else if(a>=0){lo=Math.min(a,b);hi=Math.max(a,b)}else return;let w=order.slice(lo,hi+1).join("");let target=cur().words.includes(w);let valid=DICT.has(w)&&canMake(w,cur().letters);if(valid&&!found.includes(w)&&!bonus.includes(w)){if(target)found.push(w);else bonus.push(w);score+=w.length*10+(target?15:0);sfx("word");if(navigator.vibrate)navigator.vibrate(18);message((target?"Dream word! ":"Bonus! ")+w+" ✦");render();if(w===cur().letters){if(!completed.includes(li)){completed.push(li);hints=Math.min(9,hints+1)}let ratio=found.length/cur().words.length;stars[li]=Math.max(stars[li]||0,ratio>=.9?3:ratio>=.55?2:1);unlocked=levels.length;save();setTimeout(()=>{$("wintext").textContent=`You found ${w}! Level ${li+1} complete.`;sfx("level");$("overlay").classList.add("show")},300)}}else{sfx("bad");message(found.includes(w)||bonus.includes(w)?"Already found":"Not in dictionary")}selectedIdx=[];clear();renderTiles()}

track.onpointerdown=e=>{if(paused)return;select=true;a=b=-1;clear();track.setPointerCapture?.(e.pointerId);paint(e.clientX);e.preventDefault()};
track.onpointermove=e=>{if(select)paint(e.clientX)};track.onpointerup=()=>{if(select){select=false;submit()}};track.onpointercancel=()=>{select=false;clear()};
track.addEventListener("click",()=>{if(selectedIdx.length)submit()});
$("hint").onclick=useHint;
$("shuffle").onclick=()=>{if(paused)return;sfx("shuffle");order=mix(order.join(""));renderTiles();save()};
$("clear").onclick=()=>{if(!paused){clear();sfx("tap")}};
$("pause").onclick=pauseGame;$("resume").onclick=resumeGame;$("restart").onclick=restart;$("skipBtn").onclick=()=>goLevel((li+1)%levels.length);
$("levelPicker").onclick=()=>{pauseGame();$("pauseOverlay").classList.remove("show");$("levelsOverlay").classList.add("show");renderLevelGrid()};
$("levelsBtn").onclick=()=>{$("pauseOverlay").classList.remove("show");$("levelsOverlay").classList.add("show");renderLevelGrid()};
$("closeLevels").onclick=()=>{$("levelsOverlay").classList.remove("show");$("pauseOverlay").classList.add("show")};
$("sound").onclick=()=>setSound(!soundOn);$("menuSound").onclick=()=>setSound(!soundOn);
$("next").onclick=()=>{$("overlay").classList.remove("show");goLevel(Math.min(levels.length-1,li+1))};
setInterval(()=>{if(!paused){let ms=elapsed+(Date.now()-runStart),s=Math.floor(ms/1000);$("time").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}},250);
if(!load()){order=mix(cur().letters)}setSound(soundOn);render();message("Tap letters • drag to rearrange • tap bar to submit");
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script></body></html>
