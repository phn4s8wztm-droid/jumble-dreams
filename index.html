function tone(freq,dur,type="sine",vol=.05,delay=0){

 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();

function sfx(kind){

 if(kind==="word"){tone(660,.16,"sine",.05);tone(880,.20,"sine",.045,.08);tone(1100,.25,"sine",.035,.16)}
 if(kind==="bad"){tone(180,.12,"triangle",.025);tone(150,.13,"triangle",.02,.08)}
 if(kind==="shuffle"){tone(420,.08,"sine",.03);tone(560,.08,"sine",.03,.06);tone(720,.12,"sine",.03,.12)}
 if(kind==="level"){[523,659,784,1047].forEach((f,i)=>tone(f,.35,"sine",.045,i*.11))}
}

 [...tiles.children].forEach((t,j)=>t.classList.toggle("sel",selectedIdx.includes(j)));
 if(selectedIdx.length){
   let c=centers(),lo=Math.min(...selectedIdx),hi=Math.max(...selectedIdx),r=track.getBoundingClientRect();
   glow.style.display="block";
   glow.style.left=(c[lo]-r.left-20)+"px";
   glow.style.width=(c[hi]-c[lo]+40)+"px"
 } else glow.style.display="none"
}
function toggleTile(i){
 if(!selectedIdx.length) selectedIdx=[i];
 else {
   let lo=Math.min(...selectedIdx),hi=Math.max(...selectedIdx);
   if(i===lo-1) selectedIdx.unshift(i);
   else if(i===hi+1) selectedIdx.push(i);
   else if(i===lo||i===hi) selectedIdx=selectedIdx.filter(x=>x!==i);
   else selectedIdx=[i]
 }
 selectedIdx=[...new Set(selectedIdx)].sort((x,y)=>x-y);
 paintSelected()
}
function ds(e){
 if(paused)return;
 drag=e.currentTarget;
 let r=drag.getBoundingClientRect();
 dx=e.clientX-r.left;dy=e.clientY-r.top;
 downX=e.clientX;downY=e.clientY;downAt=Date.now();moved=false;
 drag.setPointerCapture?.(e.pointerId);
 e.preventDefault()
}
function dm(e){
 if(!drag)return;
 let dist=Math.hypot(e.clientX-downX,e.clientY-downY);
 if(!ph && dist<12)return;
 moved=true;
 if(!ph){
   let r=drag.getBoundingClientRect();
   ph=document.createElement("div");ph.className="ph";
   tiles.insertBefore(ph,drag);
   drag.classList.add("drag");
   Object.assign(drag.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"})
 }
 drag.style.left=e.clientX-dx+"px";
 drag.style.top=e.clientY-dy+"px";
 let others=[...tiles.children].filter(x=>x!==drag&&x!==ph),target=others.length;
 for(let i=0;i<others.length;i++){
   let r=others[i].getBoundingClientRect();
   if(e.clientX<r.left+r.width/2){target=i;break}
 }
 tiles.insertBefore(ph,others[target]||null);
 e.preventDefault()
}
function de(e){
 if(!drag)return;
 let tapped=!moved && Math.hypot((e?.clientX||downX)-downX,(e?.clientY||downY)-downY)<12;
 if(ph){
   tiles.insertBefore(drag,ph);ph.remove();
   drag.classList.remove("drag");drag.removeAttribute("style");
   order=[...tiles.querySelectorAll(".tile")].map(x=>x.textContent);sfx("drag");
   selectedIdx=[];renderTiles();save()
 } else if(tapped){
   toggleTile(+drag.dataset.i);sfx("tap")
 }
 drag=null;ph=null
}
function centers(){return [...tiles.children].map(t=>{let r=t.getBoundingClientRect();return r.left+r.width/2})}function nearest(x){let c=centers(),q=0,d=1e9;c.forEach((v,i)=>{if(Math.abs(v-x)<d){d=Math.abs(v-x);q=i}});return q}
function paint(x){let c=centers(),i=nearest(x);if(a<0)a=i;b=i;let lo=Math.min(a,b),hi=Math.max(a,b),r=track.getBoundingClientRect();glow.style.display="block";glow.style.left=(c[lo]-r.left-20)+"px";glow.style.width=(c[hi]-c[lo]+40)+"px";[...tiles.children].forEach((t,j)=>t.classList.toggle("sel",j>=lo&&j<=hi))}
function clear(){a=b=-1;selectedIdx=[];glow.style.display="none";[...tiles.children].forEach(t=>t.classList.remove("sel"))}function message(x){$("msg").textContent=x;clearTimeout(message.t);message.t=setTimeout(()=>$("msg").textContent="",900)}
function submit(){
 let lo,hi;
 if(selectedIdx.length){lo=Math.min(...selectedIdx);hi=Math.max(...selectedIdx)}
 else if(a>=0){lo=Math.min(a,b);hi=Math.max(a,b)}
 else return;
 let w=order.slice(lo,hi+1).join("");
 if(cur().words.includes(w)&&!found.includes(w)){
   found.push(w);score+=w.length*10;sfx("word");message(w+" ★");render();
   if(w===cur().letters)setTimeout(()=>{$("wintext").textContent=`You found ${w}!`;sfx("level");$("overlay").classList.add("show")},350)
 } else {sfx("bad");message(found.includes(w)?"Already found":"Try another word")};
 selectedIdx=[];clear();renderTiles()
}
track.onpointerdown=e=>{if(paused)return;select=true;a=b=-1;clear();track.setPointerCapture?.(e.pointerId);paint(e.clientX);e.preventDefault()};track.onpointermove=e=>{if(select)paint(e.clientX)};track.onpointerup=()=>{if(select){select=false;submit()}};track.onpointercancel=()=>{select=false;clear()};

track.addEventListener("click",()=>{if(selectedIdx.length)submit()});
$("shuffle").onclick=()=>{sfx("shuffle");order=mix(order.join(""));renderTiles();save()};$("clear").onclick=clear;$("pause").onclick=()=>{paused=!paused;message(paused?"PAUSED":"GO!")};$("next").onclick=()=>{$("overlay").classList.remove("show");li=(li+1)%levels.length;found=[];order=mix(cur().letters);start=Date.now();render()};
setInterval(()=>{if(!paused){let s=Math.floor((Date.now()-start)/1000);$("time").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}},250);
try{
 if(!load() || !Array.isArray(order) || order.length!==cur().letters.length){
   order=mix(cur().letters);found=[];
 }
}catch(e){order=mix(cur().letters);found=[]}
render();
message("Tap letters • drag to rearrange • tap bar to submit");
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
})();
</script></body></html>
